<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Candal&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kelly+Slab&display=swap"
      rel="stylesheet"
    />
    <title>tailwindcss</title>
  </head>
  <body>
    <div class="w-[70%] mx-auto mt-50">
      <div>
        <img
          class="w-55 h-7 mb-10"
          src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/06/Tailwind_CSS_logo_with_dark_text.svg/3840px-Tailwind_CSS_logo_with_dark_text.svg.png"
        />
      </div>
      <div>
        <h1 class="text-6xl font-bold">
          Rapidly build modern websites <br />
          without ever leaving your HTML.
        </h1>
      </div>
      <div class="mt-10 mb-10">
        <h2 class="text-2xl">
          A utility-first CSS framework packed with classes like
          <span
            >flex, pt-4, text-center <span>and </span><br />
            rotate-90</span
          >
          that can be composed to build any design, directly in your markup.
        </h2>
      </div>
      <div>
        <button class="bg-black py-2 px-10 rounded text-white">
          <a href="https://v2.tailwindcss.com/docs"><h3>Get started</h3></a>
        </button>
        <button class="border-1 border-gray-600 py-2 px-10 rounded">
          <h4>$ npm install tailwindcss</h4>
        </button>
      </div>
    </div>
  </body>
</html>
